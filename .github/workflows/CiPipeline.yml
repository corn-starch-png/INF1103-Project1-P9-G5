name: CI pipeline actions #ENABLE REQUIRE STATUS CHECK before merging

#use gitleaks-action @v3 , use checkout@v6

on:
  push: 
     #runs on push to all branches
  pull_request:
    branches: [ "main" ]  #runs when PR targeting main is received
  workflow_dispatch: #enables manual button to run workflow

jobs: #gitub required status checks are expecting job names to pass!
  GitLeaks: #name of job, docs: https://github.com/gitleaks/gitleaks-action/blob/master/README.md
    name: GitLeaks scan 
    runs-on: ubuntu-latest #no container, static code analysis

    
    permissions:
      contents: read
      pull-requests: write 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6 #clone repo source code
        with:
          fetch-depth: 0 #currently scanning  full github history

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} #auto created by github to allow PR comments


PipAudit:
  name: Auditing vulnerable dependencies
  runs-on: ubuntu-latest

  steps:
    - name: Checkout repository
      uses: actions/checkout@v6

    - name: Install project dependencies
      run: python -m pip install .

    - name: Audit dependencies
      uses: pypa/gh-action-pip-audit@v1.1.0


  Linting_with_ruff: #name of  job
    name: Linting with Ruff
    runs-on: ubuntu-latest #spins up ubuntu vm
    container:
      image: python:3.14-slim  #pulls up docker image to finish the job

    steps: #copies repo code into the created container
    - name : Checkout repository 
      uses: actions/checkout@v6 #clones repo source code
      #rule set docs https://docs.astral.sh/ruff/rules/
    - name: Log Advisory rules violations with ruff 
      uses: astral-sh/ruff-action@v4.1.0
      with:
        args: check --exit-zero --output-format=github .

    - name: Log enforced rules violations with ruff
      uses: astral-sh/ruff-action@v4.1.0
      with:
        args: check --output-format=github --exit-zero --ignore B904,B905,B007,E712,E501,E701,I001,F401,F541,F841,SIM102,RUF059,FURB157,PLC0206 .

    - name: Check formatting with Ruff
      uses: astral-sh/ruff-action@v4.1.0
      continue-on-error: true 
      with:
        args: format --check --diff  .


  Pytest_Python: #name of  job
      name: Running PytestScript 
      runs-on: ubuntu-latest #spins up ubuntu vm
      container:
        image: python:3.14-slim  #pulls up docker image to finish the job

      steps: #copies repo code into the created container
      - name : Checkout repository 
        uses: actions/checkout@v6 #clones repo source code

      - name: Install dependencies #install what our app needs to run
        run: |
          python -m pip install --upgrade pip
          pip install -r python_dependencies.txt  

      - name: Test with pytest #run application custom test script 
        run: python -m pytest test_script.py -v


  test-docker-images: #name of  job, test our container
    name: Build QuantiFresh Docker image + smoke test 
    runs-on: ubuntu-latest
   #no container this time, we are already building docker image

    steps:
    - uses: actions/checkout@v6

    - name: Build Docker image
      run: docker compose -f .github/smoke_test/docker-compose.ci.yml build test

    - name: Docker smoke test
      run: bash .github/scripts/docker-smoke-test.sh 


  Pytest_Docker: #name of  job
    name: Running PytestScript on QuantiFresh
    runs-on: ubuntu-latest #spins up ubuntu vm

    steps: 
    - name : Checkout repository 
      uses: actions/checkout@v6 #clones repo source code

    - name: Build Docker image
      run: docker compose -f .github/smoke_test/docker-compose.ci.yml build test

    - name: Run pytest inside Docker
      run: docker compose -f .github/smoke_test/docker-compose.ci.yml run --rm test python -m pytest test_script.py -v

