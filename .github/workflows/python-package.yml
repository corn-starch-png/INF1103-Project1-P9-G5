name: CI pipeline actions #ENABLE REQUIRE STATUS CHECK before merging

on:
  push: 
    branches: [ "main" ] #runs on push to main 
  pull_request:
    branches: [ "main" ]  #runs when PR targeting main is received
  workflow_dispatch: #enables manual button to run workflow

jobs:
  Lint_and_customtest: #name of 1st job
    name: Lint and customtest
    runs-on: ubuntu-latest #spins up ubuntu vm
    container:
      image: python:3.14-slim  #pulls up docker image to finish the job

    steps: #copies repo code into the created container
    - uses: actions/checkout@v4

    - name: Install dependencies #install what our app needs to run
      run: |
        python -m pip install --upgrade pip
        python -m pip install flake8 pytest
        pip install -r requirements.txt  

    - name: Lint with flake8 #explained in template
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    - name: Test with pytest #run application custom test script 
      run: python -m pytest test_script.py -v


  test-docker-images:
    runs-on: ubuntu-latest
    container:
      image: python:3.14-slim

    steps:
    - uses: actions/checkout@v4

    - name: Docker Image smoke test 
      run : |
        docker-compose \
          -f docker-compose.ci.yml \
          up \
          --build \   #builds local file
          --exit-code-from test \  # returns exit code of test service 
          test

   
